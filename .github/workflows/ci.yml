# Runs the Definition of Done checks (AGENTS.md §4) on every push and pull request:
# the automated test suite, a strict TypeScript check and the production build.
# Needs no database or secrets: the tests mock Prisma, and the build connects lazily.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, types and build
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
