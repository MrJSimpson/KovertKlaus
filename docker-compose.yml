services:
  kovertklaus-db:
    image: postgres:16-alpine
    container_name: kovertklaus-db
    restart: always
    environment:
      POSTGRES_USER: kovert
      # From .env (scripts/ensure-db-password.mjs creates it); never committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - run npm run db:password}
      POSTGRES_DB: kovertklaus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovert -d kovertklaus"]
      interval: 5s
      timeout: 5s
      retries: 5

  kovertklaus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kovertklaus-app
    restart: always
    ports:
      - "2425:2425"
    environment:
      - DATABASE_URL=postgresql://kovert:${POSTGRES_PASSWORD}@kovertklaus-db:5432/kovertklaus?schema=public&sslmode=disable
      - DATABASE_ADMIN_URL=postgresql://kovert:${POSTGRES_PASSWORD}@kovertklaus-db:5432/kovertklaus?schema=public&sslmode=disable
      - DIRECT_URL=postgresql://kovert:${POSTGRES_PASSWORD}@kovertklaus-db:5432/kovertklaus?schema=public&sslmode=disable
      - NODE_ENV=production
      - LIFECYCLE_CRON_ENABLED=true
      - LIFECYCLE_CRON_INTERVAL_MINUTES=60
      # Copies of deleted accounts' data, kept 30 days (src/lib/export-store-disk.ts).
      - EXPORT_DIR=/app/data/exports
    volumes:
      - kovertklaus_exports:/app/data/exports
    depends_on:
      kovertklaus-db:
        condition: service_healthy

volumes:
  postgres_data:
  kovertklaus_exports:
